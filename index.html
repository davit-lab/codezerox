  <body>
    <div id="root"></div>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      // This script checks to see if a redirect is present from the 404.html page
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
    <script type="text/javascript">
      // Anti-debug / inspect-element deterrent
      (function() {
        'use strict';
        const devtools = { open: false, threshold: 160 };

        // Block right-click
        document.addEventListener('contextmenu', function(e) {
          e.preventDefault();
          return false;
        });

        // Block common devtools shortcuts
        document.addEventListener('keydown', function(e) {
          if (
            e.key === 'F12' ||
            (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) ||
            (e.ctrlKey && e.key === 'U')
          ) {
            e.preventDefault();
            e.stopPropagation();
            return false;
          }
        });

        // Detect devtools via debugger timing
        const check = function() {
          const start = performance.now();
          debugger;
          const end = performance.now();
          if ((end - start) > devtools.threshold) {
            if (!devtools.open) {
              devtools.open = true;
              // Attempt to disrupt console
              console.clear && console.clear();
              setInterval(function() { console.clear && console.clear(); }, 100);
            }
          } else {
            devtools.open = false;
          }
        };
        setInterval(check, 1000);

        // Obscure console methods on load
        (function() {
          var noop = function() {};
          ['log','warn','error','info','debug','trace','dir','table'].forEach(function(m) {
            if (window.console && window.console[m]) window.console[m] = noop;
          });
        })();
      })();
    </script>
